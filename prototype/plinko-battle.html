<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>斗蛐蛐模拟器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07090d; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #c9d6e4; user-select: none;
  }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script type="module">
import {
  addSquad, computeCenters, computeSquadTargets
} from "./js/squad-layer.js";
import { stepUnits } from "./js/group-layer.js";
import { stepWeapons } from "./js/weapon-system.js";
import {
  applyDamage, stepRegen, stepChargers, initCombat
} from "./js/defense-system.js";
import { drawUnits, drawProjectiles, drawUnitGlyph } from "./js/render-units.js";
import { Grid, SpatialDebug, SpatialStats } from "./js/spatial.js";
import { drawFx } from "./js/render-fx.js";
import { createBoard, stepBoard, drawBoard } from "./js/plinko.js";
import {
  TEMPLATES, LOOSE_SQUAD, BASE_HP, templateDef, templateHue, swatchColor
} from "./js/templates.js";

(() => {
  "use strict";

  // ---------- 画布 ----------
  const cvs = document.getElementById("c");
  const ctx = cvs.getContext("2d");
  let W = 0, H = 0;
  let grid = null;            // 空间索引，只服务武器系统（见 design/.../05）

  // ---------- 全局参数 ----------
  const S = {
    drag: 0.30, stallSpeed: 60, stallAccel: 100, arriveR: 46,
    shieldHp: 80, chargerRange: 140, chargerCd: 2.5,
    energyMax: 100, energyCost: 25, energyRegen: 8,
    paused: false,
    over: -1              // -1 未结束；0/1 = 胜利方
  };

  const FIXED = 1 / 60;
  const POP_CAP = 200;        // 每方人口上限
  const STATION_R = 52;       // 基地把单位推开的半径
  const ZOOM = 1.2;           // 战场缩放：> 1 表示单位在屏幕上画得更大（适配手机）
  const FODDER_X = 5;         // 基地散兵产出速度倍率（基准间隔 1.0~1.6s，除以此值）
  const CATCHUP_GAP = 50;    // 落后多少人口开始追赶
  const CATCHUP_MUL = 3;      // 追赶时落球速度倍率

  // ---------- 状态 ----------
  let squads = [];
  let units = [];
  let projectiles = [];
  let fx = [];
  const hits = [];
  let combatT = 0;

  // 布局：左侧战场 + 右侧栏（上半发球区，下半战斗群介绍）
  let FX = 0, FY = 0, FW = 0, FH = 0;      // 战场矩形；单位坐标原点是战场左上角
  let SIDE = { x: 0, y: 0, w: 0, h: 0 };   // 右侧栏
  let board = null;                         // 双方共用的落球机
  let legendY = 0, legendH = 0;
  let LEGEND_LAYOUT = null;
  // 战斗群介绍里每行左侧的两套色标就是按钮：左半蓝方、右半红方
  // legendHit[行*2 + 阵营] = { x, y, w, h, i, faction }
  let legendHit = [];
  let hoverHit = -1;                        // 悬停中的色标
  let pressHit = -1;                        // 刚按下的色标，闪一下
  let pressHitT = 0;
  let legendPop = [];                       // 点色标后的「+N」飘字
  let flash = { t: 0, bin: -1 };            // 刚落球的槽，闪一下
  let bases = [];
  // 固定编制：每方 = 每个模板一个小队 + 一个小队额的散兵
  // 槽位永不增删，所以不需要复用逻辑，也不会有引用串位
  let templateSquads = [[], []];
  let looseSquad = [-1, -1];
  let popCount = [0, 0];        // 每方当前人口（每帧重算）

  function recountPop() {
    popCount[0] = 0;
    popCount[1] = 0;
    for (const u of units) {
      const sq = squads[u.squad];
      if (sq) popCount[sq.faction]++;
    }
  }

  // ---------- 布局 ----------
  function layout() {
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width = W;
    cvs.height = H;
    cvs.style.width = W + "px";
    cvs.style.height = H + "px";

    const GAP = 12;

    // 右侧栏：宽度随窗口自适应
    const sideW = Math.round(Math.min(520, Math.max(360, W * 0.30)));
    SIDE = { x: W - sideW - GAP, y: GAP, w: sideW, h: H - GAP * 2 };

    // 左侧战场：画面尺寸 ÷ ZOOM = 世界尺寸。ZOOM 越大，单位在屏幕上越显眼
    FX = GAP;
    FY = GAP;
    FW = (SIDE.x - GAP * 2) / ZOOM;
    FH = (H - GAP * 2) / ZOOM;

    // 空间索引跟着战场尺寸走
    if (!grid) grid = new Grid(FW, FH, 64);
    else grid.setSize(FW, FH);

    // 侧栏上半：双方共用的落球机（高度比原来矮 1.5 倍，给下方介绍腾地方）
    const boardH = Math.round(Math.max(170, Math.min(SIDE.h * 0.46, 520) / 1.5));
    board = createBoard({
      x: SIDE.x + 14,
      y: SIDE.y + 40,
      w: SIDE.w - 28,
      h: boardH,
      binCount: TEMPLATES.length,
      factions: 2,
      // 小球下落变慢。0.70 是实测出来的：小球从顶到底的耗时约为原来的 1.46×
      speedScale: 0.70,
    });

    // 侧栏下半：战斗群介绍
    legendY = board.y + board.h + 46;
    legendH = SIDE.y + SIDE.h - legendY - 14;
    LEGEND_LAYOUT = buildLegendLayout();

    anchorBases();
  }
  window.addEventListener("resize", layout);

  /** 基地：蓝方在左下角，红方在右上角，成对角摆开 */
  function basePos(faction) {
    const m = 92;
    return faction === 0
      ? { x: m, y: FH - m }        // 蓝：左下
      : { x: FW - m, y: m };       // 红：右上
  }

  function anchorBases() {
    for (const b of bases) {
      const p = basePos(b.faction);
      b.x = p.x; b.y = p.y;
      if (b.unit) { b.unit.x = p.x; b.unit.y = p.y; }
    }
    updateLooseGoal();            // 窗口变了，战场中心也变了
  }

  // ---------- 基地 ----------
  function makeBase(faction) {
    const p = basePos(faction);
    const id = addSquad(squads, {
      key: "base",
      hue: faction === 0 ? 205 : 5,
      sat: 70,
      weapon: "laser",
      p: { members: 1, hp: BASE_HP, regen: 0, chargers: 0, hitR: STATION_R }
    }, faction);

    const sq = squads[id];
    const u = {
      x: p.x, y: p.y, vx: 0, vy: 0,
      squad: id, alpha: 0, cAll: 0,
      base: true,       // 渲染时单独画
      obstacle: true    // 物理上只做障碍，不被散兵的凝聚力吸引
    };
    units.push(u);
    initCombat(u, sq, 0);

    return {
      faction, squadId: id, unit: u,
      x: p.x, y: p.y,
      hp: BASE_HP, maxHp: BASE_HP,
      spawnTimer: 2.0, dead: false, pulse: Math.random() * 6
    };
  }

  /** 每方建立固定编制：N 个模板小队 + 1 个散兵小队 */
  function buildSquads(faction) {
    const ids = [];
    for (const tpl of TEMPLATES) {
      ids.push(addSquad(squads, templateDef(tpl, faction), faction));
    }
    templateSquads[faction] = ids;

    looseSquad[faction] = addSquad(squads, {
      key: LOOSE_SQUAD.key,
      name: LOOSE_SQUAD.name,
      hue: templateHue(LOOSE_SQUAD, faction),
      sat: 38,            // 掉色
      flatLum: 38,        // 压暗（和正规小队的 54 拉开层次）
      loose: true,
      weapon: LOOSE_SQUAD.weapon,
      p: LOOSE_SQUAD.p
    }, faction);
  }

  /** 散兵小队：命令点直接指向【敌方基地】 */
  function updateLooseGoal() {
    for (let f = 0; f < 2; f++) {
      const id = looseSquad[f];
      if (id < 0 || !squads[id]) continue;
      const enemy = bases[1 - f];
      if (!enemy) continue;
      squads[id].goal = { x: enemy.x, y: enemy.y };
    }
  }

  /** 在基地附近取一个出生点（朝战场一侧扇形展开） */
  function spawnAroundBase(faction, spreadRad, rMin, rMax) {
    const b = bases[faction];
    const bx = b ? b.x : basePos(faction).x;
    const by = b ? b.y : basePos(faction).y;
    // 蓝在左下 → 朝右上；红在右上 → 朝左下
    const dir = faction === 0 ? -Math.PI / 4 : Math.PI * 3 / 4;
    const a = dir + (Math.random() - 0.5) * spreadRad;
    const r = rMin + Math.random() * (rMax - rMin);
    return {
      x: Math.max(26, Math.min(FW - 26, bx + Math.cos(a) * r)),
      y: Math.max(26, Math.min(FH - 26, by + Math.sin(a) * r))
    };
  }

  /** 基地定期产出一个散兵（进入固定的散兵小队） */
  function spawnLooseUnit(faction) {
    if (popCount[faction] >= POP_CAP) return;
    const id = looseSquad[faction];
    if (id < 0) return;
    const sq = squads[id];
    if (!sq) return;

    const p = spawnAroundBase(faction, Math.PI * 1.6, STATION_R + 10, STATION_R + 44);

    const u = {
      x: p.x, y: p.y, vx: 0, vy: 0,
      squad: id, alpha: 0, cAll: 0
    };
    units.push(u);
    initCombat(u, sq, Math.random() < 0.25 ? 0 : 99);
    sq.cn += 1;
    popCount[faction] += 1;
  }

  // ---------- 落球机产兵：直接并入该模板的固定小队 ----------
  function spawnBatch(tplIndex, faction) {
    const id = templateSquads[faction][tplIndex];
    if (id === undefined || id < 0) return;
    const sq = squads[id];
    if (!sq) return;

    const n = Math.max(1, Math.floor(sq.p.members));
    const c = spawnAroundBase(faction, Math.PI * 0.9, STATION_R + 16, STATION_R + 95);

    // 小队内充能器比例
    const chargerRatio = (sq.p.chargers || 0) / Math.max(1, sq.p.members);

    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * 26;
      const u = {
        x: c.x + Math.cos(a) * r,
        y: c.y + Math.sin(a) * r,
        vx: 0, vy: 0,
        squad: id, alpha: 0, cAll: 0
      };
      units.push(u);
      initCombat(u, sq, Math.random() < chargerRatio ? 0 : 99);
    }

    popCount[faction] += n;
    sq.cn += n;
    return id;
  }

  // ---------- 点战斗群介绍里的色标：给对应阵营新开一个该模板的小队 ----------
  // 与落球机不同：落球是往【已有】的固定小队里补人，这里每次都新建一支小队，
  // 所以战后不会互相串味，点击次数也只受人口上限约束。
  function spawnTemplateSquad(faction, tplIndex) {
    const tpl = TEMPLATES[tplIndex];
    if (!tpl || S.over >= 0) return 0;

    const n = Math.max(1, Math.floor((tpl.p && tpl.p.members) || 1));
    const room = POP_CAP - popCount[faction];
    const take = Math.min(n, room);
    if (take <= 0) return 0;              // 人口满了

    const id = addSquad(squads, templateDef(tpl, faction), faction);
    const sq = squads[id];
    const c = spawnAroundBase(faction, Math.PI * 0.8, STATION_R + 16, STATION_R + 80);
    const chargerRatio = (sq.p.chargers || 0) / Math.max(1, sq.p.members);

    for (let k = 0; k < take; k++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * 26;
      const u = {
        x: c.x + Math.cos(a) * r,
        y: c.y + Math.sin(a) * r,
        vx: 0, vy: 0,
        squad: id, alpha: 0, cAll: 0
      };
      units.push(u);
      initCombat(u, sq, Math.random() < chargerRatio ? 0 : 99);
    }

    popCount[faction] += take;
    sq.cn += take;
    return take;
  }

  // ---------- 物理 ----------
  function physics(dt) {
    computeCenters(units, squads);
    computeSquadTargets(units, squads);
    stepUnits(units, squads, S, dt, FW, FH);

    // 关在战场里
    for (const u of units) {
      if (u.y < 8) { u.y = 8; if (u.vy < 0) u.vy = -u.vy * 0.3; }
      if (u.y > FH - 8) { u.y = FH - 8; if (u.vy > 0) u.vy = -u.vy * 0.3; }
      if (u.x < 8) { u.x = 8; if (u.vx < 0) u.vx = -u.vx * 0.3; }
      if (u.x > FW - 8) { u.x = FW - 8; if (u.vx > 0) u.vx = -u.vx * 0.3; }
    }

    // 基地：钉住 + 把单位推开
    for (const b of bases) {
      if (b.dead) continue;
      b.unit.x = b.x; b.unit.y = b.y; b.unit.vx = 0; b.unit.vy = 0;

      for (const u of units) {
        if (u === b.unit) continue;
        const dx = u.x - b.x, dy = u.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > STATION_R * STATION_R || d2 < 1e-6) continue;
        const d = Math.sqrt(d2);
        const k = ((STATION_R - d) / d) * 0.30;
        u.x += dx * k;
        u.y += dy * k;
      }
    }
  }

  // ---------- 战斗 ----------
  function combat(dt) {
    combatT += dt;
    stepRegen(units, dt);
    stepChargers(units, squads, S, dt, fx);

    hits.length = 0;

    // 空间索引：位置已经全部更新完毕，这里重建一次，整帧有效
    grid.clear();
    for (let i = 0; i < units.length; i++) grid.insert(i, units[i]);

    stepWeapons(units, squads, projectiles, dt, hits, combatT, fx, grid);

    if (hits.length) {
      let anyDead = false;
      for (const h of hits) {
        if (applyDamage(h.t, h.dmg, h.pierce)) anyDead = true;
      }
      if (anyDead) {
        let w = 0;
        for (let i = 0; i < units.length; i++) {
          if (units[i].hp > 0) units[w++] = units[i];
        }
        units.length = w;
      }
    }
  }

  // ---------- 基地产出 / 生死 ----------
  function updateBases(dt) {
    for (const b of bases) {
      if (b.dead) continue;
      b.hp = b.unit.hp;
      b.pulse += dt;

      if (b.hp <= 0) {
        b.dead = true;
        if (S.over < 0) S.over = b.faction === 0 ? 1 : 0;
        continue;
      }

      b.spawnTimer -= dt;
      if (b.spawnTimer <= 0) {
        b.spawnTimer = (1.0 + Math.random() * 0.6) / FODDER_X;
        spawnLooseUnit(b.faction);
      }
    }
  }

  function stepFx(dt) {
    for (let i = fx.length - 1; i >= 0; i--) {
      const e = fx[i];
      if (e.delay > 0) { e.delay -= dt; continue; }
      e.life -= dt;
      if (e.life <= 0) fx.splice(i, 1);
    }
  }

  // ---------- 落球机 → 小队（双方共用一块板，事件带阵营） ----------
  function pumpPlinko(dt) {
    const ended = S.over >= 0;

    for (let f = 0; f < 2; f++) {
      const hp = board.hoppers[f];
      if (!hp) continue;
      const gap = popCount[1 - f] - popCount[f];
      const catchup = gap >= CATCHUP_GAP;

      // 落后方：提高落球频率 + 发球口冒火
      hp.speedMul = catchup ? 1 / CATCHUP_MUL : 1;
      hp.catchup = catchup;
      if (catchup && hp.timer > 1.2) hp.timer = 1.2;

      hp.allow = !ended && popCount[f] < POP_CAP;
    }

    const evs = [];
    stepBoard(board, dt, evs);

    for (const ev of evs) {
      const tpl = TEMPLATES[ev.bin];
      if (!tpl) continue;
      // 整队的人都要放得下，避免冲过人口上限
      const need = Math.max(1, Math.floor(tpl.p.members || 1));
      if (popCount[ev.faction] + need > POP_CAP) continue;
      spawnBatch(ev.bin, ev.faction);
      flash.t = 0.45;
      flash.bin = ev.bin;
    }

    if (flash.t > 0) flash.t -= dt;
  }

  // ---------- 基地绘制 ----------
  function drawBase(b) {
    const hue = b.faction === 0 ? 205 : 5;
    const R = 34;
    const alive = !b.dead;

    ctx.save();
    ctx.translate(b.x, b.y);
    if (!alive) ctx.globalAlpha = 0.35;

    // 外环
    ctx.beginPath();
    ctx.arc(0, 0, R + 11, 0, Math.PI * 2);
    ctx.strokeStyle = "hsla(" + hue + ",70%,60%,.22)";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // 四根支撑臂
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * (R - 6), Math.sin(a) * (R - 6));
      ctx.lineTo(Math.cos(a) * (R + 10), Math.sin(a) * (R + 10));
      ctx.strokeStyle = "hsla(" + hue + ",60%,55%,.55)";
      ctx.lineWidth = 3.5;
      ctx.stroke();
    }

    // 六边形主体
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 - Math.PI / 6;
      const px = Math.cos(a) * R, py = Math.sin(a) * R;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = "hsla(" + hue + ",35%,16%,.96)";
    ctx.fill();
    ctx.strokeStyle = "hsla(" + hue + ",72%,58%,.85)";
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // 核心
    if (alive) {
      const pulse = 0.72 + 0.28 * Math.sin(b.pulse * 2.6);
      ctx.beginPath();
      ctx.arc(0, 0, 14 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = "hsla(" + hue + ",85%,62%,.28)";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, 6.5, 0, Math.PI * 2);
      ctx.fillStyle = "hsla(" + hue + ",90%,82%,.95)";
      ctx.fill();
    }

    ctx.restore();

    // 血条
    const bw = 84, bh = 5;
    const bx = b.x - bw / 2, by = b.y + R + 20;
    const f = Math.max(0, Math.min(1, b.hp / b.maxHp));

    ctx.fillStyle = "rgba(6,10,16,.8)";
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = f > 0.5 ? "hsl(" + hue + ",72%,58%)"
                  : f > 0.25 ? "#e8c14a" : "#e8564f";
    ctx.fillRect(bx, by, bw * f, bh);

    ctx.save();
    ctx.font = "600 10px 'Segoe UI', system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillStyle = "rgba(150,175,200,.75)";
    ctx.fillText(Math.max(0, Math.round(b.hp)) + " / " + b.maxHp, b.x, by + 8);
    ctx.restore();
  }

  // ---------- 渲染 ----------
  const BIN_LABELS = TEMPLATES.map(t => t.name);
  // 双方共用一块板，槽位颜色用「蓝方」那套，正好和下方介绍的蓝方色块对应
  const BIN_COLORS = TEMPLATES.map(t => swatchColor(templateHue(t, 0)));

  function render() {
    ctx.fillStyle = "#07090d";
    ctx.fillRect(0, 0, W, H);

    // ---------- 左：战场（单位坐标原点是战场左上角，这里平移 + 缩放） ----------
    ctx.save();
    ctx.translate(FX, FY);
    ctx.scale(ZOOM, ZOOM);

    ctx.setLineDash([5, 9]);
    ctx.strokeStyle = "rgba(80,120,160,.14)";
    ctx.lineWidth = 1 / ZOOM;                 // 缩放后仍然是 1px
    ctx.strokeRect(0.5, 0.5, FW - 1, FH - 1);
    ctx.setLineDash([]);

    for (const b of bases) drawBase(b);
    drawUnits(ctx, units, squads);
    drawFx(ctx, fx);
    drawProjectiles(ctx, projectiles);
    drawHud();

    ctx.restore();

    // ---------- 右：侧栏 ----------
    drawSidePanel();
  }

  /** 右侧栏：上半发球区，下半战斗群介绍 */
  function drawSidePanel() {
    // 背板
    ctx.fillStyle = "rgba(10,15,22,.55)";
    ctx.strokeStyle = "rgba(80,120,160,.20)";
    ctx.lineWidth = 1;
    ctx.strokeRect(SIDE.x + 0.5, SIDE.y + 0.5, SIDE.w - 1, SIDE.h - 1);
    ctx.fillRect(SIDE.x, SIDE.y, SIDE.w, SIDE.h);

    // ---------- 顶栏：双方人口 + 追赶状态 ----------
    const ty = SIDE.y + 20;
    const ca = (popCount[1] - popCount[0]) >= CATCHUP_GAP;
    const cb = (popCount[0] - popCount[1]) >= CATCHUP_GAP;

    ctx.textBaseline = "middle";
    ctx.textAlign = "left";

    // 蓝方
    ctx.beginPath();
    ctx.arc(SIDE.x + 17, ty, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(150,215,255,.95)";
    ctx.fill();

    ctx.font = "700 13px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#5fa8e8";
    const bTxt = "蓝 " + popCount[0];
    ctx.fillText(bTxt, SIDE.x + 26, ty);
    const bW = ctx.measureText(bTxt).width;

    ctx.font = "500 11px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#5c758c";
    ctx.fillText("/" + POP_CAP, SIDE.x + 28 + bW, ty);
    const bW2 = ctx.measureText("/" + POP_CAP).width;

    if (ca) {
      ctx.font = "600 11px 'Microsoft YaHei', system-ui, sans-serif";
      ctx.fillStyle = "#f0b429";
      ctx.fillText("追赶中", SIDE.x + 30 + bW + bW2, ty);
    }

    // 红方（右对齐）
    ctx.textAlign = "right";
    ctx.font = "700 13px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#e8614f";
    const rTxt = popCount[1] + " 红";
    ctx.fillText(rTxt, SIDE.x + SIDE.w - 26, ty);
    const rW = ctx.measureText(rTxt).width;

    ctx.font = "500 11px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#5c758c";
    ctx.fillText("/" + POP_CAP + " ", SIDE.x + SIDE.w - 28 - rW, ty);
    const rW2 = ctx.measureText("/" + POP_CAP + " ").width;

    ctx.beginPath();
    ctx.arc(SIDE.x + SIDE.w - 17, ty, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,160,140,.95)";
    ctx.fill();

    if (cb) {
      ctx.font = "600 11px 'Microsoft YaHei', system-ui, sans-serif";
      ctx.fillStyle = "#f0b429";
      ctx.fillText("追赶中", SIDE.x + SIDE.w - 30 - rW - rW2, ty);
    }

    // 落球机
    const hi = flash.t > 0 ? flash.bin : -1;
    drawBoard(ctx, board, BIN_LABELS, BIN_COLORS, hi);

    // 小标题：战斗群
    ctx.textAlign = "left";
    ctx.font = "600 13px 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif";
    ctx.fillStyle = "rgba(150,190,225,.75)";
    ctx.fillText("战斗群", SIDE.x + 16, legendY - 20);

    // 提示：色标可以点
    ctx.textAlign = "right";
    ctx.font = "500 11px 'Microsoft YaHei', system-ui, sans-serif";
    ctx.fillStyle = "rgba(120,150,180,.55)";
    ctx.fillText("点色标出兵 · 左蓝右红", SIDE.x + SIDE.w - 16, legendY - 20);
    ctx.textAlign = "left";

    drawLegend();
  }

  function sideStats(faction) {
    let n = 0, hp = 0, sq = 0;
    for (const u of units) {
      if (u.base) continue;
      if (squads[u.squad].faction !== faction) continue;
      n++; hp += Math.max(0, u.hp) + u.shield;
    }
    for (const s of squads) {
      if (s.faction === faction && s.cn > 0 && s.key !== "base") sq++;
    }
    return { n, hp: Math.round(hp), squads: sq };
  }

  /** 发球区底部的小队介绍：武器 / 防御 / 阵型（文案已放大 2 倍，超出列宽自动换行） */
  const LEGEND = TEMPLATES.map(t => ({
    name: t.name,
    hueB: t.hue[0],          // 蓝方标记色
    hueR: t.hue[1],          // 红方标记色
    info: t.info
  }));

  /** 按字符折行（中文逐字断，英文单词可能被拆，够用） */
  function wrapText(text, maxW) {
    const out = [];
    let cur = "";
    for (const ch of String(text)) {
      const t = cur + ch;
      if (cur && ctx.measureText(t).width > maxW) { out.push(cur); cur = ch; }
      else cur = t;
    }
    if (cur) out.push(cur);
    return out;
  }

  /**
   * 竖排的侧栏介绍，三列布局：
   *   左：蓝/红两套色标 + 名字
   *   中：防御 / 阵型（折行）
   *   右：武器
   * 字号从 14 往下试，直到 6 个战斗群全部塞进下方区域。
   */
  function buildLegendLayout() {
    const x0 = SIDE.x + 16;
    const w = SIDE.w - 32;

    const NAME_X = 72;                       // 相对 x0 的名字起点（色标占前面）
    const nameColW = Math.max(150, Math.round(w * 0.40));
    const weaponColW = 58;                   // 右侧留给武器的宽度
    const textX = x0 + nameColW;
    const textW = Math.max(80, w - nameColW - weaponColW);

    let fs = 14;
    let rows, lh, total;

    for (; fs >= 9; fs--) {
      lh = Math.round(fs * 1.45);
      ctx.save();
      ctx.font = "500 " + fs + "px 'Microsoft YaHei', system-ui, sans-serif";
      rows = LEGEND.map(it => {
        const defLines = wrapText(it.info.defense, textW);
        const fmlLines = wrapText(it.info.formation, textW);
        const lines = defLines.length + fmlLines.length;
        return { defLines, fmlLines, lines, h: lines * lh + 10 };
      });
      ctx.restore();

      total = rows.reduce((s, r) => s + r.h, 0);
      if (total <= legendH) break;
    }

    // 富余的高度分给每一行（有上限，免得行距被拉得太散）
    const gap = Math.min(22, Math.max(0, (legendH - total) / rows.length));
    let y = legendY;
    for (const r of rows) { r.y = y; y += r.h + gap; }

    // 色标 = 按钮。两个色标相距 30px，分界线取 29：
    // 蓝标定在 x0+14、红标定在 x0+44，各自留下约 14px 的富余
    const MARK_SPLIT = 29;
    legendHit = [];
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      legendHit.push(
        { i, faction: 0, x: x0 + 1, y: r.y, w: MARK_SPLIT, h: r.h },
        { i, faction: 1, x: x0 + MARK_SPLIT, y: r.y, w: 30, h: r.h }
      );
    }

    return { x0, w, nameColW, weaponColW, textX, textW, nameX: x0 + NAME_X, fs, lh, rows, gap, markSplit: MARK_SPLIT };
  }

  /** 三个小箭头摆成三角阵型，代表一个战斗群（尺寸与战场上的单位一致） */
  function drawSquadMark(cx, cy, color) {
    drawUnitGlyph(ctx, cx + 8, cy, 0, 1, color);          // 领头
    drawUnitGlyph(ctx, cx - 6, cy - 7, 0, 1, color);      // 左翼
    drawUnitGlyph(ctx, cx - 6, cy + 7, 0, 1, color);      // 右翼
  }

  function drawLegend() {
    const L = LEGEND_LAYOUT;
    if (!L) return;

    ctx.textBaseline = "middle";
    ctx.textAlign = "left";

    for (let i = 0; i < LEGEND.length; i++) {
      const it = LEGEND[i];
      const r = L.rows[i];
      const cy = r.y + r.h / 2;

      // 行分隔
      if (i > 0) {
        ctx.strokeStyle = "rgba(80,120,160,.10)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(L.x0, r.y - L.gap / 2);
        ctx.lineTo(L.x0 + L.w, r.y - L.gap / 2);
        ctx.stroke();
      }

      // ---- 左列：色标（= 按钮） + 名字 ----
      for (let f = 0; f < 2; f++) {
        const hi = i * 2 + f;
        if (hi !== hoverHit && hi !== pressHit) continue;
        drawMarkGlow(legendHit[hi], f === 0 ? it.hueB : it.hueR, hi === pressHit);
      }

      drawSquadMark(L.x0 + 14, cy, swatchColor(it.hueB));
      drawSquadMark(L.x0 + 44, cy, swatchColor(it.hueR));

      let nfs = L.fs + 1;
      ctx.font = "600 " + nfs + "px 'Microsoft YaHei', system-ui, sans-serif";
      const maxNameW = L.nameColW - 78;
      while (nfs > 9 && ctx.measureText(it.name).width > maxNameW) {
        nfs--;
        ctx.font = "600 " + nfs + "px 'Microsoft YaHei', system-ui, sans-serif";
      }
      ctx.fillStyle = "#dbe6f0";
      ctx.fillText(it.name, L.nameX, cy);

      // ---- 右列：武器 ----
      ctx.textAlign = "right";
      ctx.font = "500 " + L.fs + "px 'Microsoft YaHei', system-ui, sans-serif";
      ctx.fillStyle = "#7f95ab";
      ctx.fillText(it.info.weapon, L.x0 + L.w, cy);
      ctx.textAlign = "left";

      // ---- 中列：防御 / 阵型，整块垂直居中 ----
      ctx.font = "500 " + L.fs + "px 'Microsoft YaHei', system-ui, sans-serif";
      let ty = cy - (r.lines - 1) * L.lh / 2;
      ctx.fillStyle = "#93a9bf";
      for (const line of r.defLines) { ctx.fillText(line, L.textX, ty); ty += L.lh; }
      ctx.fillStyle = "#7f95ab";
      for (const line of r.fmlLines) { ctx.fillText(line, L.textX, ty); ty += L.lh; }
    }

    // 点色标后的「+N」飘字
    for (const p of legendPop) {
      ctx.globalAlpha = Math.min(1, p.life / 0.45);
      ctx.textAlign = "center";
      ctx.font = "700 12px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = p.hue === null ? "#f0b429" : "hsl(" + p.hue + ",85%,68%)";
      ctx.fillText(p.text, p.x, p.y - (0.85 - p.life) * 30);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }

  /** 悬停/按下色标时的底衬：让人看出这块能点 */
  function drawMarkGlow(hb, hue, pressed) {
    const x = hb.x + 2, y = hb.y + 3, w = hb.w - 4, h = hb.h - 6;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, 7);
    else ctx.rect(x, y, w, h);
    ctx.fillStyle = "hsla(" + hue + ",80%,60%," + (pressed ? 0.30 : 0.13) + ")";
    ctx.fill();
    ctx.strokeStyle = "hsla(" + hue + ",90%,66%," + (pressed ? 0.80 : 0.45) + ")";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // ---------- 战斗群介绍里的色标：命中测试 ----------
  function hitLegendMark(x, y) {
    for (let k = 0; k < legendHit.length; k++) {
      const hb = legendHit[k];
      if (x >= hb.x && x <= hb.x + hb.w && y >= hb.y && y <= hb.y + hb.h) return k;
    }
    return -1;
  }

  function stepLegendPop(dt) {
    for (let i = legendPop.length - 1; i >= 0; i--) {
      legendPop[i].life -= dt;
      if (legendPop[i].life <= 0) legendPop.splice(i, 1);
    }
    if (pressHit >= 0) {
      pressHitT -= dt;
      if (pressHitT <= 0) pressHit = -1;
    }
  }

  function drawHud() {
    const y = H - 32;
    ctx.save();
    ctx.textBaseline = "middle";

    const a = sideStats(0), b = sideStats(1);
    const ba = bases[0], bb = bases[1];
    const ca = (popCount[1] - popCount[0]) >= CATCHUP_GAP;
    const cb = (popCount[0] - popCount[1]) >= CATCHUP_GAP;

    ctx.textAlign = "left";
    ctx.font = "600 12px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#5fa8e8";
    ctx.fillText("蓝方", 16, y);
    ctx.font = "500 11px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = ca ? "#e8c14a" : "#8ba4bb";
    ctx.fillText(
      "队伍 " + a.squads + "  ·  单位 " + a.n + "/" + POP_CAP + (ca ? " · 追赶中" : "") +
      "  ·  血量 " + a.hp +
      (ba ? "  ·  基地 " + Math.max(0, Math.round(ba.hp)) : ""),
      58, y
    );

    ctx.textAlign = "right";
    ctx.font = "600 12px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#e8614f";
    ctx.fillText("红方", FW - 16, y);
    ctx.font = "500 11px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = cb ? "#e8c14a" : "#8ba4bb";
    ctx.fillText(
      (bb ? "基地 " + Math.max(0, Math.round(bb.hp)) + "  ·  " : "") +
      "血量 " + b.hp + "  ·  单位 " + b.n + "/" + POP_CAP + (cb ? " · 追赶中" : "") +
      "  ·  队伍 " + b.squads,
      FW - 58, y
    );

    ctx.textAlign = "center";
    ctx.font = "500 11px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = (popCount[0] >= POP_CAP || popCount[1] >= POP_CAP) ? "#e8c14a" : "#5c7386";
    ctx.fillText("总单位 " + units.length, FW / 2, y);

    ctx.textBaseline = "middle";
    ctx.textAlign = "center";
    ctx.font = "500 10.5px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#3f4f60";
    ctx.fillText("空格 暂停   ·   R 重开", FW / 2, FH - 12);

    if (S.over >= 0) {
      // S.over 记的是【胜利方】，所以被摧毁的是另一方
      const winner = S.over === 0 ? "蓝方" : "红方";
      const loser = S.over === 0 ? "红方" : "蓝方";

      ctx.textAlign = "center";
      ctx.font = "700 34px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = S.over === 0 ? "rgba(95,168,232,.9)" : "rgba(232,97,79,.9)";
      ctx.fillText(winner + "胜利", FW / 2, FH / 2 - 26);

      ctx.font = "500 14px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = "rgba(160,180,200,.65)";
      ctx.fillText(loser + "基地被摧毁", FW / 2, FH / 2 + 12);

      ctx.font = "500 12px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = "rgba(160,180,200,.45)";
      ctx.fillText("按 R 重开", FW / 2, FH / 2 + 40);
    } else if (S.paused) {
      ctx.font = "700 26px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = "rgba(255,255,255,.16)";
      ctx.fillText("暂停", FW / 2, FH / 2);
    }
    ctx.restore();
  }

  // ---------- 键盘 ----------
  window.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k === " ") { S.paused = !S.paused; e.preventDefault(); }
    else if (k === "r") reset();
  });

  // 注：点击【落球机槽位】直接出兵的功能仍然没有（双方共用一块板，
  // 需要先有一个「点哪一方」的交互）。现在的出兵入口是下方战斗群介绍里的色标：
  // 蓝标 → 蓝方，红标 → 红方。
  function canvasXY(e) {
    const r = cvs.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  cvs.addEventListener("pointermove", e => {
    const p = canvasXY(e);
    const k = hitLegendMark(p.x, p.y);
    hoverHit = k;
    cvs.style.cursor = k >= 0 ? "pointer" : "default";
  });

  cvs.addEventListener("pointerleave", () => {
    hoverHit = -1;
    cvs.style.cursor = "default";
  });

  cvs.addEventListener("pointerdown", e => {
    const p = canvasXY(e);
    const k = hitLegendMark(p.x, p.y);
    if (k < 0) return;
    const hb = legendHit[k];
    pressHit = k;
    pressHitT = 0.16;
    if (S.over >= 0) return;              // 已经分出胜负，不再增兵

    const n = spawnTemplateSquad(hb.faction, hb.i);
    const row = LEGEND_LAYOUT.rows[hb.i];
    legendPop.push({
      x: hb.x + hb.w / 2,
      y: row.y + row.h / 2 - 8,
      text: n > 0 ? "+" + n : "满",
      hue: n > 0 ? templateHue(TEMPLATES[hb.i], hb.faction) : null,
      life: 0.85
    });
  });

  function reset() {
    squads = [];
    units = [];
    projectiles = [];
    fx = [];
    hits.length = 0;
    combatT = 0;
    bases = [];
    templateSquads = [[], []];
    looseSquad = [-1, -1];
    flash = { t: 0, bin: -1 };
    legendPop = [];
    hoverHit = -1;
    pressHit = -1;
    S.over = -1;
    S.paused = false;

    layout();                     // 先算好战场矩形 / 侧栏 / 落球机
    buildSquads(0);               // 每方固定 N+1 个小队
    buildSquads(1);
    bases = [makeBase(0), makeBase(1)];
    anchorBases();
    updateLooseGoal();            // 散兵小队：指向战场中心
  }

  // ---------- 主循环 ----------
  reset();

  let last = performance.now();
  let acc = 0;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;

    if (!S.paused) {
      acc += dt;
      let guard = 0;
      while (acc >= FIXED && guard++ < 5) {
        recountPop();
        pumpPlinko(FIXED);
        physics(FIXED);
        combat(FIXED);
        updateBases(FIXED);
        acc -= FIXED;
      }
      if (acc > FIXED) acc = 0;
      stepFx(dt);
      stepLegendPop(dt);
    }

    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 调试钩子
  window.__U = () => units;
  window.__SQ = () => squads;
  window.__S = S;
  window.__BOARDS = () => board;
  window.__BASES = () => bases;

  // 空间索引：__SPATIAL.debug.brute = true 可切回全量扫描，用于差分对比
  window.__SPATIAL = {
    debug: SpatialDebug,
    stats: SpatialStats,
    grid: () => grid,
    probe() {
      // 抽一张快照，供外部核对「候选集是否包含所有命中者」
      return { units: units.length, grid: grid ? { cols: grid.cols, rows: grid.rows, cell: grid.cell } : null };
    },
  };
})();
</script>
</body>
</html>
