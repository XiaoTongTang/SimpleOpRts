<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pixelTool · 像素画编辑器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">pixelTool<small>像素画编辑器</small></div>

  <div class="group">
    <label>画布</label>
    <input id="docW" type="number" min="1" max="512" value="32">
    <span class="x">×</span>
    <input id="docH" type="number" min="1" max="512" value="32">
    <button id="btnNew">新建</button>
  </div>

  <div class="group">
    <button id="btnUndo" title="Ctrl+Z">撤销</button>
    <button id="btnRedo" title="Ctrl+Shift+Z">重做</button>
    <button id="btnFit">适应窗口</button>
    <button id="btnZoomOut">−</button>
    <span id="zoomLabel" class="label">100%</span>
    <button id="btnZoomIn">+</button>
  </div>

  <div class="group">
    <label class="chk"><input id="tglGrid" type="checkbox" checked>网格</label>
    <label class="chk"><input id="tglCheck" type="checkbox" checked>透明格</label>
    <label class="chk"><input id="tglOnion" type="checkbox">洋葱皮</label>
  </div>

  <div class="group right">
    <button id="btnExport">导出 PNG</button>
    <button id="btnExportStrip">导出精灵表</button>
  </div>
</header>

<main>
  <aside id="tools" class="tools"></aside>

  <section id="canvasWrap">
    <canvas id="board"></canvas>
    <div id="status" class="status"></div>
  </section>

  <aside class="side">
    <div class="panel">
      <div class="panel-title">颜色 <input id="colorInput" type="color" value="#5fa8e8"></div>
      <div id="palette" class="palette"></div>
    </div>

    <div class="panel">
      <div class="panel-title">图层
        <span class="tiny">
          <button id="btnAddLayer" title="新建图层">＋</button>
          <button id="btnDelLayer" title="删除图层">－</button>
          <button id="btnMerge" title="向下合并">合</button>
        </span>
      </div>
      <div id="layers" class="layers"></div>
    </div>

    <div class="panel">
      <div class="panel-title">帧
        <span class="tiny">
          <button id="btnAddFrame" title="新建空帧">＋</button>
          <button id="btnDupFrame" title="复制当前帧">⧉</button>
          <button id="btnDelFrame" title="删除当前帧">－</button>
        </span>
      </div>
      <div id="frames" class="frames"></div>
      <div id="sizeLabel" class="label small"></div>
    </div>
  </aside>
</main>

<script src="pixelcore.js"></script>
<script src="ui.js"></script>
</body>
</html>
